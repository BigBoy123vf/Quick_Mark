<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Check-in code · QuickMark</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500;1,6..72,600&family=Geist+Mono:wght@400;500;600&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_v('css/style.css') }}">
  <link rel="stylesheet" href="{{ static_v('css/buttons.css') }}">
</head>
<body class="qrposter-body">

  <div class="qrposter__bar">
    <a class="qrposter__back" href="{{ url_for('courses.index') }}">← Courses</a>
    <p class="qrposter__hint">One code for all your classes. It routes to whatever session you've started.</p>
    <button class="btn btn--ghost" type="button" onclick="window.print()">Print poster</button>
  </div>

  <main class="qrposter">
    <div class="qrposter__brand">
      <span class="site-brand__mark" aria-hidden="true"></span>
      <span>QuickMark</span>
    </div>

    <p class="qrposter__owner">{{ current_user.full_name }}</p>
    <h1 class="qrposter__lead">Scan to <em>check&nbsp;in</em>.</h1>

    <div class="qrposter__frame">
      <span class="qrposter__bracket qrposter__bracket--tl" aria-hidden="true"></span>
      <span class="qrposter__bracket qrposter__bracket--tr" aria-hidden="true"></span>
      <span class="qrposter__bracket qrposter__bracket--bl" aria-hidden="true"></span>
      <span class="qrposter__bracket qrposter__bracket--br" aria-hidden="true"></span>
      <div class="qrposter__code">{{ qr_svg|safe }}</div>
    </div>

    <ol class="qrposter__steps">
      <li>Point your camera</li>
      <li>Confirm you're in the room</li>
      <li>You're marked present</li>
    </ol>

    <p class="qrposter__url">{{ scan_url }}</p>
  </main>

</body>
</html>
