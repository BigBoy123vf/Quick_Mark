{% from 'student/_settings.html' import settings_panel with context %}
<nav class="bottom-bar" aria-label="Student navigation">
  <a class="bottom-bar__item {{ 'active' if active_tab == 'scan' }}" href="{{ url_for('scan.scanner') }}">
    <svg class="bottom-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="M4 7V4h3M17 4h3v3M20 17v3h-3M7 20H4v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/>
    </svg>
    <span class="bottom-bar__label">Scan</span>
  </a>

  <a class="bottom-bar__item {{ 'active' if active_tab == 'history' }}" href="{{ url_for('main.history') }}">
    <svg class="bottom-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
    </svg>
    <span class="bottom-bar__label">History</span>
  </a>

  <div class="bottom-bar__settings">
    {{ settings_panel('mobile') }}
    <button class="bottom-bar__item" type="button" data-dropdown-trigger aria-controls="settings-mobile" aria-expanded="false">
      <svg class="bottom-bar__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 0 0-.1-1l2-1.5-2-3.5-2.4 1a7 7 0 0 0-1.7-1L14.5 3h-5l-.3 2.5a7 7 0 0 0-1.7 1l-2.4-1-2 3.5L3 11a7 7 0 0 0 0 2l-2 1.5 2 3.5 2.4-1a7 7 0 0 0 1.7 1l.3 2.5h5l.3-2.5a7 7 0 0 0 1.7-1l2.4 1 2-3.5-2-1.5a7 7 0 0 0 .1-1Z"/>
      </svg>
      <span class="bottom-bar__label">Settings</span>
    </button>
  </div>
</nav>
